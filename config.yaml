# Quest Align centralized configuration.
# All values must match the documentation and the source code.

# --- HMD-Poser checkpoint ---
checkpoint_path: "pretrained_model/pretrained_model_protocol1.pt"
strict_checkpoint_loading: true

# --- Model architecture (must match checkpoint) ---
model_name: "HMD_imu_HME_Universe"
sparse_dim: 135
input_motion_length: 40

model_params:
  number_layer: 3
  hidden_size: 256
  dropout: 0.05
  nhead: 8
  block_num: 2

# --- Frequencies and timing ---
# Nominal server loop frequency (Hz)
server_loop_rate_hz: 60

# Frequency HMD-Poser was trained at (Hz)
expected_model_rate_hz: 60

# Quest-Android pairing tolerance (ms).
# Must be greater than the expected inter-packet interval (e.g. 125 ms at 8 Hz).
synchronization_tolerance_ms: 200

# Maximum time gap allowed within the sliding window (ms).
# Must be greater than the real interval between unique synced pairs.
# Without resampling, the window frequency equals the synced-pair frequency,
# not the server loop frequency.
max_window_gap_ms: 200

# Timeout after which a sensor is considered lost (s)
sensor_timeout_s: 0.5

# --- Temporal window ---
temporal_window_frames: 40

# --- Calibration ---
# Number of frames used for neutral posture calibration (output angles only)
posture_calib_frames: 30

# Android acceleration type. Allowed values:
#   - "accelerometer": gravity included (TYPE_ACCELEROMETER)
#   - "linear":        gravity removed   (TYPE_LINEAR_ACCELERATION)
# Verified from the Android emitter source code: TYPE_ACCELEROMETER.
android_acceleration_type: "accelerometer"

# Quaternion order in each emitter. Allowed values: "xyzw" or "wxyz".
# null is NOT accepted; the server will refuse to start.
quest_quaternion_order: "xyzw"
android_quaternion_order: "wxyz"

# Internal coordinate system: right-handed, Y up, Z forward, meters.
internal_coordinate_system: "right_handed_y_up_z_forward_meters"

# Phone-to-pelvis mounting rotation matrix.
# If null, identity is used and the assumption is documented.
phone_mount_transform: null

# Required sensor mode.
# Options: quest_only, quest_plus_pelvis, hmd_poser_2imu, hmd_poser_3imu
required_sensor_mode: "quest_plus_pelvis"

# --- UDP ---
quest_port: 5006
android_port: 5005

# --- Recording ---
records_dir: "RECORDS"

# --- Feature schema ---
feature_schema_version: "hmd_poser_135_v1"

# --- Emitters (reference) ---
# Quest/Unity emitter not available in this repository.
# Android emitter not available in this repository.
# Quaternion order and acceleration type must be verified against the
# corresponding emitter source code.
