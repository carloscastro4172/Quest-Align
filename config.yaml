# Configuración centralizada de Quest Align.
# Todos los valores deben coincidir con la documentación y con el código.

# --- Checkpoint HMD-Poser ---
checkpoint_path: "pretrained_model/pretrained_model_protocol1.pt"
strict_checkpoint_loading: true

# --- Arquitectura del modelo (debe coincidir con el checkpoint) ---
model_name: "HMD_imu_HME_Universe"
sparse_dim: 135
input_motion_length: 40

model_params:
  number_layer: 3
  hidden_size: 256
  dropout: 0.05
  nhead: 8
  block_num: 2

# --- Frecuencias y timing ---
# Frecuencia nominal del bucle del servidor (Hz)
server_loop_rate_hz: 60

# Frecuencia objetivo a la que HMD-Poser fue entrenado (Hz)
expected_model_rate_hz: 60

# Tolerancia de sincronización entre Quest y Android (ms)
synchronization_tolerance_ms: 100

# Máximo salto temporal permitido dentro de la ventana deslizante (ms)
max_window_gap_ms: 100

# Timeout para considerar que un sensor se ha perdido (s)
sensor_timeout_s: 0.5

# --- Ventana temporal ---
temporal_window_frames: 40

# --- Calibración ---
# Número de frames usados para calibrar la postura neutral (solo ángulos de salida)
posture_calib_frames: 30

# Tipo de aceleración Android. Valores permitidos:
#   - "accelerometer": incluye gravedad (TYPE_ACCELEROMETER)
#   - "linear": gravedad removida (TYPE_LINEAR_ACCELERATION)
#   - null: no verificado (el código NO aplica ninguna corrección de gravedad)
android_acceleration_type: null

# Orden de cuaterniones en cada emisor. Posibles valores: "xyzw" o "wxyz".
# Null significa "no verificado con el emisor".
quest_quaternion_order: null
android_quaternion_order: "wxyz"

# Sistema de coordenadas interno: right-handed, Y up, Z forward, metros.
internal_coordinate_system: "right_handed_y_up_z_forward_meters"

# Matriz de montaje del teléfono respecto a la pelvis.
# Si es null, se usa la identidad y se documenta el supuesto.
phone_mount_transform: null

# Modo de sensores requerido.
# Opciones: quest_only, quest_plus_pelvis, hmd_poser_2imu, hmd_poser_3imu
required_sensor_mode: "quest_plus_pelvis"

# --- UDP ---
quest_port: 5006
android_port: 5005

# --- Grabación ---
records_dir: "RECORDS"

# --- Feature schema ---
feature_schema_version: "hmd_poser_135_v1"

# --- Emisores (referencia) ---
# Quest/Unity emisor no disponible en este repositorio.
# Android emisor no disponible en este repositorio.
# Los campos de orden de cuaterniones y tipo de aceleración deben verificarse
# en el código del emisor correspondiente.
